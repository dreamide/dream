allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  node-pty: true
  sharp: false

# pnpm's cache of post-install results held a broken snapshot of electron
# (cli.js recorded as deleted), which every install then restored and broke
# `pnpm dev`. Build scripts run fresh instead of trusting that cache.
sideEffectsCache: false

supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - x64
    - arm64

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - node-pty

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.80'
  - '@ai-sdk/react@4.0.102'
  - ai@7.0.99
